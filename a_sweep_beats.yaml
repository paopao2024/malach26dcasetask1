# W&B Bayesian sweep for BEATs fine-tuning -- OFFICIAL-METRIC version.
#
# Optimizes val/hF, where hF is the organizers' OFFICIAL hierarchical F-score
# from evaluate.py (imported via a_official_metric.macro_hPRF). This supersedes
# the older sweep_beats.yaml which optimized the wrong metric (val/hf_correct).
#
# Hyperparameter ranges mirror the professors' beats_finetuning.yaml exactly.
# Param names are HYPHENATED to match a_finetune_beats.py's CLI flags so
# ${args} expands to flags the script accepts.
#
# Launch:
#   wandb sweep a_sweep_beats.yaml          # prints a sweep ID
#   wandb agent <sweep-id> --count 8        # one agent per free GPU
program: a_finetune_beats.py
project: dcase2026-task1
method: bayes
metric:
  name: val/hF
  goal: maximize
parameters:
  learning-rate:
    values: [5e-6, 1e-5, 2e-5, 3e-5, 4e-5, 5e-5]
  weight-decay:
    values: [0.0, 0.01, 0.05]
  warmup-epochs:
    values: [0.1, 0.5, 1]
  lr-decay-start-epoch:
    values: [1, 3, 5, 7]
  min-learning-rate:
    values: [0, 1e-6]
  max-epochs:
    values: [10, 15, 20]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --batch-size=4            # forced: BEATs default 6 OOMs on Maxwell
  - --wandb-project=dcase2026-task1
  - --wandb-mode=online
  - ${args}
