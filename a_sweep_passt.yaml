# W&B Bayesian sweep for PaSST fine-tuning -- OFFICIAL-METRIC version.
#
# Optimizes val/hF, the organizers' OFFICIAL hierarchical F-score from
# evaluate.py (imported via a_official_metric.macro_hPRF). This supersedes
# the older sweep_passt.yaml which optimized the wrong metric.
#
# Hyperparameter ranges mirror the professors' beats_finetuning.yaml (same
# search space they used for both encoders). Param names are HYPHENATED to
# match a_finetune_passt.py's CLI flags.
#
# Launch:
#   export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#   wandb sweep a_sweep_passt.yaml          # prints a sweep ID
#   wandb agent <sweep-id> --count 8        # one agent per free GPU
#
# Expect occasional NaN trials at the high end of the LR range -- full
# fine-tuning at batch=1 is fragile. The sweep self-corrects, but if NaNs
# recur, cap the LR range lower in a fresh sweep (drop 4e-5, 5e-5).
program: a_finetune_passt.py
project: dcase2026-task1
method: bayes
metric:
  name: val/hF
  goal: maximize
parameters:
  learning-rate:
    values: [5e-6, 1e-5, 2e-5, 3e-5, 4e-5, 5e-5]
  weight-decay:
    values: [0.0, 0.01, 0.05]
  warmup-epochs:
    values: [0.1, 0.5, 1]
  lr-decay-start-epoch:
    values: [1, 3, 5, 7]
  min-learning-rate:
    values: [0, 1e-6]
  max-epochs:
    values: [10, 15, 20]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --batch-size=1            # forced: PaSST OOMs above batch 1 on 11-12 GB
  - --wandb-project=dcase2026-task1
  - --wandb-mode=online
  - ${args}
